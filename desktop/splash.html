<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>LectureLab</title>
    <style>
      :root { --bg: #f7f7fb; --text: #171a2b; --muted: #6e7389; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d0f17; --text: #ecedf5; --muted: #8c90a5; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: grid; place-items: center; box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6); }
      h1 { margin: 6px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 13px; color: var(--muted); }
      .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(128, 128, 160, 0.2); overflow: hidden; margin-top: 6px; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #6366f1; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" /></svg>
      </div>
      <h1>LectureLab</h1>
      <p>Getting things ready…</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
