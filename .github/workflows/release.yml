# Builds the LectureLab desktop apps and publishes them as a GitHub Release.
#
# Release a new version: Actions → Release → "Run workflow" → type e.g. 0.3.0.
# (Pushing a tag like v0.3.0 works too.) Free for public repositories.
# Installed apps check the latest Release for updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0"
        required: true

permissions:
  contents: write

jobs:
  # 1. Create a draft release (students don't see drafts).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if ! gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v$V" -R "${{ github.repository }}" --draft --target "${{ github.sha }}" --title "LectureLab $V" --notes "$(cat <<'EOF'
          ## Download

          - **Mac** (Apple Silicon, M1 or newer): **LectureLab-Mac.dmg**
          - **Windows** 10/11 (64-bit): **LectureLab-Windows-Setup.exe**

          **First time opening:** on Mac, if macOS says it can't verify the app, open System Settings → Privacy & Security and click **Open Anyway**. On Windows, if you see "Windows protected your PC", click **More info → Run anyway**. You only do this once.

          Your courses and progress are kept when you update.
          EOF
          )"
          fi

  # 2. Build each app and attach it to the draft (electron-builder uploads into an existing draft).
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # must match NODE_VERSION's major in scripts/prepare-desktop.mjs
          cache: npm

      - name: Install
        shell: bash
        run: |
          npm ci
          npm ci --prefix desktop
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version --prefix desktop
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build server and bundle Node.js
        run: npm run desktop:prepare

      - name: Package and upload
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without an Apple Developer ID the Mac app is ad-hoc signed (see docs/RELEASING.md).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Lets "Re-run failed jobs" add a missing installer to an already-published release.
          EP_GH_IGNORE_TIME: "true"
        run: >
          npx electron-builder ${{ matrix.target }} --publish always
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.extraMetadata.version=${{ needs.prepare.outputs.version }}

  # 3. Publish, so download links and updates switch to the new version.
  #    If one platform failed (e.g. GitHub had no Mac machines free), the other is
  #    still released; use "Re-run failed jobs" later to add the missing one.
  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          NAMES=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '[.assets[].name] | join(" ")')
          HAS_MAC=$(echo "$NAMES" | grep -c "LectureLab-Mac.dmg" || true)
          HAS_WIN=$(echo "$NAMES" | grep -c "LectureLab-Windows-Setup.exe" || true)
          if [ "$HAS_MAC" = "0" ] && [ "$HAS_WIN" = "0" ]; then echo "No installers were built — not publishing."; exit 1; fi
          if [ "$HAS_MAC" != "0" ] && [ "$HAS_WIN" != "0" ]; then
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
          else
            # Only one platform built. Publish it, but keep the previous complete release as
            # "latest" so neither download link breaks. Re-run the failed job to finish.
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest=false
            echo "::warning::Only one installer was built. Use 'Re-run failed jobs' to add the other; the release becomes 'latest' then."
          fi
